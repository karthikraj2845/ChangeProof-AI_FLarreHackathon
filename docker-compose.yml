version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: changeproof-backend
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=ChangeProof AI
      - APP_ENV=production
      - DEBUG=false
      - DATABASE_URL=sqlite:///./changeproof.db
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      - AI_PROVIDER=${AI_PROVIDER:-auto}
    volumes:
      - backend-data:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: changeproof-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  backend-data:
